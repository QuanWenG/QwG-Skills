display_name: NovelAI 标签提示词助手
short_description: 将自然语言、参考图或已有提示词整理为带画师串、Base/Character/Undesired Content 分区的 NovelAI/NAI 英文 tag prompt。
default_prompt: 请使用 skill-novelai-helper 将我的图像想法、参考图或已有 prompt 转换为 NovelAI/NAI-style English tag prompt，必须包含画师串，并拆分为 Base prompt、Character prompt 和 Undesired Content；按需要补充权重、多角色分段和简短说明。
